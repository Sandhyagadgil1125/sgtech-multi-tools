<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG-Multi-Tools | Premium Utility Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">SG Multi Tools</div>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#about">About</a>
            <a href="#tools">Tools</a>
            <a href="#contact">Contact</a>
        </nav>
        <button class="menu-toggle">☰</button>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Next-Gen Utilities</h1>
        <p>Premium, frontend-only tools with a futuristic touch.</p>
    </section>

    <!-- Main Content -->
    <main id="tools">
        <div class="container">
            <div class="tools-grid" id="toolsGrid">
                <!-- Tool Cards will be injected here by JS -->
            </div>
        </div>
    </main>

    <!-- Dynamic Modal -->
    <div id="toolModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tool Name</h2>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Tool Interface loads here -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 SG-Multi-Tools. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
